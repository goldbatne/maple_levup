<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="100%" height="100%"
     style="image-rendering: pixelated; image-rendering: crisp-edges;">

  <!-- ── 아이콘 판 (원작 스킬 아이콘 결: 밝은 라운드 사각 + 어두운 테두리) ── -->
  <rect x="2" y="0" width="24" height="28" fill="#262630"/>
  <rect x="0" y="2" width="28" height="24" fill="#262630"/>
  <rect x="1" y="1" width="26" height="26" fill="#262630"/>

  <rect x="3" y="1" width="22" height="26" fill="#e2e2ea"/>
  <rect x="1" y="3" width="26" height="22" fill="#e2e2ea"/>
  <rect x="2" y="2" width="24" height="24" fill="#e2e2ea"/>

  <!-- 아래쪽 한 단 어둡게 (2단 계단 음영, 그라데이션 아님) -->
  <rect x="2" y="17" width="24" height="8" fill="#c8c8d4"/>
  <rect x="3" y="17" width="22" height="9" fill="#c8c8d4"/>

  <!-- 위쪽 하이라이트 -->
  <rect x="3" y="1" width="22" height="1" fill="#f7f7fc"/>
  <rect x="2" y="2" width="1" height="1" fill="#f0f0f6"/>
  <rect x="25" y="2" width="1" height="1" fill="#f0f0f6"/>

  <!-- ── 포자 구름 (오른쪽 위로 퍼진다) ── -->
  <!-- 외곽 어두운 녹색 -->
  <rect x="17" y="4" width="5" height="1" fill="#425c14"/>
  <rect x="16" y="5" width="7" height="1" fill="#425c14"/>
  <rect x="15" y="6" width="9" height="1" fill="#425c14"/>
  <rect x="15" y="7" width="9" height="1" fill="#425c14"/>
  <rect x="15" y="8" width="9" height="1" fill="#425c14"/>
  <rect x="16" y="9" width="7" height="1" fill="#425c14"/>
  <rect x="17" y="10" width="5" height="1" fill="#425c14"/>
  <!-- 본체 -->
  <rect x="18" y="5" width="3" height="1" fill="#a8d24a"/>
  <rect x="16" y="6" width="7" height="1" fill="#a8d24a"/>
  <rect x="16" y="7" width="7" height="1" fill="#a8d24a"/>
  <rect x="16" y="8" width="7" height="1" fill="#a8d24a"/>
  <rect x="17" y="9" width="5" height="1" fill="#a8d24a"/>
  <!-- 하이라이트 (왼쪽 위) -->
  <rect x="17" y="6" width="3" height="1" fill="#d4f08a"/>
  <rect x="16" y="7" width="2" height="1" fill="#d4f08a"/>
  <!-- 그림자 (오른쪽 아래) -->
  <rect x="20" y="8" width="3" height="1" fill="#78a32c"/>
  <rect x="19" y="9" width="3" height="1" fill="#78a32c"/>

  <!-- 흩어지는 작은 포자들 -->
  <rect x="23" y="10" width="2" height="1" fill="#425c14"/>
  <rect x="23" y="11" width="2" height="1" fill="#a8d24a"/>
  <rect x="24" y="3" width="2" height="2" fill="#425c14"/>
  <rect x="24" y="3" width="1" height="1" fill="#a8d24a"/>
  <rect x="13" y="10" width="2" height="2" fill="#425c14"/>
  <rect x="13" y="10" width="1" height="1" fill="#a8d24a"/>
  <rect x="21" y="12" width="1" height="1" fill="#425c14"/>
  <rect x="12" y="4" width="1" height="1" fill="#425c14"/>
  <rect x="17" y="12" width="1" height="1" fill="#425c14"/>

  <!-- ── 주황버섯 (왼쪽 아래) ── -->
  <!-- 갓 외곽 -->
  <rect x="5" y="12" width="9" height="1" fill="#4a2408"/>
  <rect x="3" y="13" width="13" height="1" fill="#4a2408"/>
  <rect x="2" y="14" width="15" height="1" fill="#4a2408"/>
  <rect x="2" y="15" width="15" height="1" fill="#4a2408"/>
  <rect x="2" y="16" width="15" height="1" fill="#4a2408"/>
  <rect x="2" y="17" width="15" height="1" fill="#4a2408"/>
  <rect x="3" y="18" width="13" height="1" fill="#4a2408"/>
  <rect x="4" y="19" width="11" height="1" fill="#4a2408"/>
  <!-- 갓 본체 -->
  <rect x="5" y="13" width="9" height="1" fill="#e07a26"/>
  <rect x="4" y="14" width="11" height="1" fill="#e07a26"/>
  <rect x="3" y="15" width="13" height="1" fill="#e07a26"/>
  <rect x="3" y="16" width="13" height="1" fill="#e07a26"/>
  <rect x="3" y="17" width="13" height="1" fill="#e07a26"/>
  <rect x="4" y="18" width="11" height="1" fill="#e07a26"/>
  <!-- 갓 하이라이트 (왼쪽 위) -->
  <rect x="5" y="14" width="4" height="1" fill="#f9a94a"/>
  <rect x="4" y="15" width="3" height="1" fill="#f9a94a"/>
  <rect x="3" y="16" width="2" height="1" fill="#f9a94a"/>
  <!-- 갓 그림자 (오른쪽 아래) -->
  <rect x="11" y="17" width="5" height="1" fill="#a84d14"/>
  <rect x="9" y="18" width="6" height="1" fill="#a84d14"/>
  <!-- 갓 무늬 -->
  <rect x="7" y="14" width="2" height="2" fill="#fdf5e4"/>
  <rect x="11" y="15" width="2" height="2" fill="#fdf5e4"/>
  <rect x="4" y="17" width="2" height="1" fill="#fdf5e4"/>

  <!-- 자루 -->
  <rect x="6" y="19" width="7" height="5" fill="#4a2408"/>
  <rect x="7" y="19" width="5" height="4" fill="#f7ead0"/>
  <rect x="10" y="19" width="2" height="4" fill="#cdb68f"/>
</svg>
